<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biler på værksted</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<header class="header">

  <div class="logo">
    BILABONNEMENT
  </div>

  <nav class="navbar">

    <a th:href="@{/}">Ny Lejeaftale</a>
    <a th:href="@{/rentals}">Se Lejeaftaler</a>
    <a th:href="@{/workshop}">Biler på Værksted</a>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="logout-button">
        Log ud
      </button>
    </form>

  </nav>

</header>

<main class="dashboard-layout">

  <section class="content" style="grid-column: 1 / 3;">

    <div class="content-card">

      <h1>Biler på værksted</h1>

      <div class="car-list workshop-car-list">

        <div class="car-card"
             th:each="car : ${cars}"
             th:with="rental=${@rentalAgreementService.getLatestByCarId(car.id)}">

          <img th:src="${car.imageUrl}" alt="Billede af bil">

          <div class="car-info">

            <h3 th:text="${car.brand + ' ' + car.model}"></h3>
            <p th:text="${car.year + ' • ' + car.transmission}"></p>
            <p th:text="'Nummerplade: ' + ${car.licensePlate}"></p>
            <p th:text="${#numbers.formatDecimal(car.pricePerDay,0,0) + ' kr/dag'}"></p>
            <p th:text="'Nypris: ' + ${#numbers.formatDecimal(car.purchasePrice,0,0) + ' kr'}"></p>
            <p style="color:#dc2626;font-weight:bold;">
              På værksted
            </p>

            <div th:if="${rental != null}">

              <p>
                <strong>Skade:</strong>
                <span th:text="${rental.damageDescription}"></span>
              </p>

              <p>
                <strong>Skadepris:</strong>
                <span th:text="${#numbers.formatDecimal(rental.damagePrice,0,0) + ' kr'}"></span>
              </p>

            </div>

          </div>

          <div class="car-card-actions">

            <form th:action="@{'/cars/return-to-available/' + ${car.id}}"
                  method="post">

              <button type="submit"
                      class="car-action-button">

                Færdig på værksted

              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </section>

</main>

<footer class="footer">
  BILABONNEMENT A/S • Vibeholmsvej 31 • 2605 Brøndby • CVR-nr. 37856827
</footer>

</body>
</html>
