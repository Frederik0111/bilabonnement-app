<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head>
    <meta charset="UTF-8">
    <title>Rediger bil</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="form-page">

    <div class="form-card">

        <h1>Rediger bil</h1>

        <form th:action="@{'/cars/update/' + ${car.id}}" method="post">

            <input type="text" name="brand" th:value="${car.brand}" placeholder="Mærke" required>
            <input type="text" name="model" th:value="${car.model}" placeholder="Model" required>
            <input type="text" name="licensePlate" th:value="${car.licensePlate}" placeholder="Nummerplade" required>
            <input type="number" name="year" th:value="${car.year}" placeholder="Årgang" required>
            <input type="text" name="transmission" th:value="${car.transmission}" placeholder="Gearkasse" required>
            <input type="number" step="0.01" name="pricePerDay" th:value="${car.pricePerDay}" placeholder="Pris pr dag" required>
            <input type="number" step="0.01" name="purchasePrice" th:value="${car.purchasePrice}" placeholder="Nypris" required>
            <div class="form-group">

                <label>Vælg billede</label>

                <div class="image-picker">

                    <label class="image-option" th:each="image : ${images}">

                        <input type="radio" name="imageUrl" th:value="${image}" th:checked="${image == car.imageUrl}" required>

                        <img th:src="${image}" alt="Bil billede">

                    </label>

                </div>

            </div>

            <div class="form-actions">

                <button type="submit" class="create-button">
                    Gem ændringer
                </button>

                <a href="/" class="cancel-button">
                    Annuller
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
